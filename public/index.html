<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Game of Bombs Clone (TS)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; }
        canvas { display: block; }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 12, 16, 0.78);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #login-overlay.hidden { display: none; }

        .login-card {
            background: #22262e;
            border: 2px solid #3b4252;
            border-radius: 12px;
            padding: 32px;
            width: 340px;
            text-align: center;
            color: #eceff4;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }
        .login-card h1 { margin: 0 0 8px; font-size: 24px; color: #ff7675; letter-spacing: 1px; }
        .login-card p { margin: 0 0 20px; font-size: 13px; color: #a4b0be; }

        #nickname-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 2px solid #4c566a;
            background: #191c22;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            margin-bottom: 14px;
            text-align: center;
        }
        #nickname-input:focus { border-color: #00b894; }

        #play-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #00b894;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s;
        }
        #play-btn:hover { background: #55efc4; }

        .controls-hint {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #3b4252;
            font-size: 12px;
            color: #8395a7;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-card">
            <h1>BOMB ARENA</h1>
            <p>Бесшовный мультиплеерный экшен</p>
            <form id="login-form">
                <input
                    id="nickname-input"
                    type="text"
                    placeholder="Введите ваш никнейм..."
                    maxlength="16"
                    autocomplete="off"
                    autofocus
                />
                <button id="play-btn" type="submit">В БОЙ</button>
            </form>
            <div class="controls-hint">
                Движение: <b>WASD</b> или <b>Стрелки</b><br>
                Бомба: <b>Пробел</b>
            </div>
        </div>
    </div>

    <canvas id="game"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script src="bundle.js"></script>
</body>
</html>
